[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-hybridconnection"
version = "0.3.0"
description = "Async Python client and listener for Azure Relay Hybrid Connections"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "websockets>=15.0,<17",
    "aiohttp>=3.9.0,<4",
]

[project.optional-dependencies]
identity = ["azure-identity>=1.17,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-mock>=3.12", "pytest-timeout>=2.3", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hybrid_connection*"]
